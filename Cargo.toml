[package]
name = "bezel"
version = "1.2.0"
edition = "2021"
description = "A Linux daemon that turns trackpad edge zones into a configurable control surface"
license = "GPL-3.0-or-later"
exclude = ["viz/*"]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
evdev = { version = "0.12.2", features = ["tokio"] }
nix = { version = "0.23.2", default-features = false }
uinput = "0.1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
notify = "6.1.1"
dirs = "5.0"
